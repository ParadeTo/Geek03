<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反思模式流程图</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    #canvas {
      border: 1px solid #ccc;
      background: white;
      display: block;
      margin: 20px auto;
    }
    .controls {
      text-align: center;
      margin: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #1565C0;
    }
  </style>
</head>
<body>
  <div class="controls">
    <h2>反思模式工作流程图</h2>
    <button onclick="downloadImage()">💾 下载图片</button>
  </div>
  <canvas id="canvas" width="900" height="900"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const colors = {
      generate: '#FFF9C4',
      reflect: '#FFECB3',
      decision: '#E1BEE7',
      end: '#C8E6C9',
      loop: '#FF5722',
      border: '#333333',
    };

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawNode(x, y, w, h, text, subText, bgColor) {
      ctx.save();
      roundRect(ctx, x, y, w, h, 8);
      ctx.fillStyle = bgColor;
      ctx.fill();
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const mainY = subText ? y + h / 2 - 10 : y + h / 2;
      ctx.fillText(text, x + w / 2, mainY);
      
      if (subText) {
        ctx.font = '16px Arial';
        ctx.fillStyle = '#666666';
        ctx.fillText(subText, x + w / 2, y + h / 2 + 15);
      }
      
      ctx.restore();
    }

    function drawDiamond(x, y, w, h, text, bgColor) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y);
      ctx.lineTo(x + w, y + h / 2);
      ctx.lineTo(x + w / 2, y + h);
      ctx.lineTo(x, y + h / 2);
      ctx.closePath();
      
      ctx.fillStyle = bgColor;
      ctx.fill();
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x + w / 2, y + h / 2);
      
      ctx.restore();
    }

    function drawArrow(x1, y1, x2, y2, color = '#333333', lineWidth = 3) {
      const headlen = 15;
      const angle = Math.atan2(y2 - y1, x2 - x1);
      
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = lineWidth;
      
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(
        x2 - headlen * Math.cos(angle - Math.PI / 6),
        y2 - headlen * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        x2 - headlen * Math.cos(angle + Math.PI / 6),
        y2 - headlen * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
      
      ctx.restore();
    }

    function drawLabel(x, y, text, color = '#000000', size = 18) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `bold ${size}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const nodeWidth = 280;
      const nodeHeight = 90;
      const centerX = 450;
      
      const nodes = {
        generate: { x: centerX - nodeWidth / 2, y: 100 },
        reflect: { x: centerX - nodeWidth / 2, y: 260 },
        decision: { x: centerX - 80, y: 430 },
        end: { x: centerX - nodeWidth / 2, y: 650 }
      };

      // 绘制节点
      drawNode(
        nodes.generate.x, nodes.generate.y, nodeWidth, nodeHeight,
        'Generate 生成',
        '生成/改进方案',
        colors.generate
      );

      drawNode(
        nodes.reflect.x, nodes.reflect.y, nodeWidth, nodeHeight,
        'Reflect 反思',
        '多维度检查评估',
        colors.reflect
      );

      drawDiamond(
        nodes.decision.x, nodes.decision.y, 160, 120,
        '是否继续？',
        colors.decision
      );

      drawNode(
        nodes.end.x, nodes.end.y, nodeWidth, nodeHeight,
        '输出最优方案',
        'Final Command',
        colors.end
      );

      // 主流程箭头
      drawArrow(
        centerX, nodes.generate.y + nodeHeight,
        centerX, nodes.reflect.y
      );

      drawArrow(
        centerX, nodes.reflect.y + nodeHeight,
        centerX, nodes.decision.y
      );

      // 决策 -> 结束
      drawArrow(
        centerX, nodes.decision.y + 120,
        centerX, nodes.end.y
      );
      drawLabel(centerX + 80, nodes.end.y - 40, '否', '#4CAF50', 20);

      // 决策 -> 生成（循环）
      ctx.save();
      ctx.strokeStyle = colors.loop;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(nodes.decision.x, nodes.decision.y + 60);
      ctx.lineTo(100, nodes.decision.y + 60);
      ctx.lineTo(100, nodes.generate.y + nodeHeight / 2);
      ctx.lineTo(nodes.generate.x, nodes.generate.y + nodeHeight / 2);
      ctx.stroke();
      ctx.restore();

      const arrowX = nodes.generate.x;
      const arrowY = nodes.generate.y + nodeHeight / 2;
      ctx.save();
      ctx.fillStyle = colors.loop;
      ctx.beginPath();
      ctx.moveTo(arrowX, arrowY);
      ctx.lineTo(arrowX - 15, arrowY - 8);
      ctx.lineTo(arrowX - 15, arrowY + 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      drawLabel(180, nodes.generate.y + nodeHeight / 2 - 30, '是', colors.loop, 18);
      drawLabel(180, nodes.generate.y + nodeHeight / 2 + 45, '带上反思建议', colors.loop, 16);


    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'reflection-workflow.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    draw();
  </script>
</body>
</html>

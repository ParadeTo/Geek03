<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高级计划模式流程图</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    #canvas {
      border: 1px solid #ccc;
      background: white;
      display: block;
      margin: 20px auto;
    }
    .controls {
      text-align: center;
      margin: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #1565C0;
    }
  </style>
</head>
<body>
  <div class="controls">
    <h2>高级计划模式工作流程图</h2>
    <button onclick="downloadImage()">下载图片</button>
  </div>
  <canvas id="canvas" width="800" height="800"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const colors = {
      nodeBg: '#E3F2FD',
      nodeBorder: '#1976D2',
      conditionBg: '#FFE0B2',
      conditionBorder: '#F57C00',
      startEnd: '#C8E6C9',
      startEndBorder: '#388E3C',
      planBg: '#F3E5F5',
      planBorder: '#7B1FA2',
      arrow: '#333333',
      loopArrow: '#1976D2',
      text: '#000000',
    };

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawDiamond(ctx, x, y, width, height) {
      ctx.beginPath();
      ctx.moveTo(x, y - height / 2);
      ctx.lineTo(x + width / 2, y);
      ctx.lineTo(x, y + height / 2);
      ctx.lineTo(x - width / 2, y);
      ctx.closePath();
    }

    function drawNode(x, y, width, height, text, bgColor, borderColor) {
      ctx.save();
      roundRect(ctx, x - width / 2, y - height / 2, width, height, 8);
      ctx.fillStyle = bgColor;
      ctx.fill();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 3;
      ctx.stroke();
      
      ctx.fillStyle = colors.text;
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const lines = text.split('\n');
      const lineHeight = 22;
      const startY = y - ((lines.length - 1) * lineHeight) / 2;
      
      lines.forEach((line, i) => {
        ctx.fillText(line, x, startY + i * lineHeight);
      });
      
      ctx.restore();
    }

    function drawDecision(x, y, width, height, text) {
      ctx.save();
      drawDiamond(ctx, x, y, width, height);
      ctx.fillStyle = colors.conditionBg;
      ctx.fill();
      ctx.strokeStyle = colors.conditionBorder;
      ctx.lineWidth = 3;
      ctx.stroke();
      
      ctx.fillStyle = colors.text;
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const lines = text.split('\n');
      const lineHeight = 20;
      const startY = y - ((lines.length - 1) * lineHeight) / 2;
      
      lines.forEach((line, i) => {
        ctx.fillText(line, x, startY + i * lineHeight);
      });
      
      ctx.restore();
    }

    function drawArrow(x1, y1, x2, y2, color = colors.arrow) {
      const headlen = 15;
      const angle = Math.atan2(y2 - y1, x2 - x1);
      
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;
      
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(
        x2 - headlen * Math.cos(angle - Math.PI / 6),
        y2 - headlen * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        x2 - headlen * Math.cos(angle + Math.PI / 6),
        y2 - headlen * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
      
      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const centerX = 400;
      const y1 = 80;
      const y2 = 200;
      const y3 = 320;
      const y4 = 440;
      const y5 = 580;
      const y6 = 700;

      // 开始节点
      drawNode(centerX, y1, 160, 60, '用户问题', colors.startEnd, colors.startEndBorder);

      // 制定整体计划
      drawNode(centerX, y2, 200, 70, '制定整体计划', colors.planBg, colors.planBorder);

      // 执行单步计划
      drawNode(centerX, y3, 200, 70, '执行单步计划', colors.nodeBg, colors.nodeBorder);

      // 反思与重新计划
      drawNode(centerX, y4, 200, 80, '反思与重新计划', colors.planBg, colors.planBorder);

      // 判断节点
      drawDecision(centerX, y5, 180, 100, '计划\n完成？');

      // 结束节点
      drawNode(centerX, y6, 160, 60, '输出结果', colors.startEnd, colors.startEndBorder);

      // 绘制箭头
      drawArrow(centerX, y1 + 30, centerX, y2 - 35);
      drawArrow(centerX, y2 + 35, centerX, y3 - 35);
      drawArrow(centerX, y3 + 35, centerX, y4 - 40);
      drawArrow(centerX, y4 + 40, centerX, y5 - 50);
      
      // 否 - 继续执行（回到执行步骤）
      ctx.save();
      ctx.strokeStyle = colors.loopArrow;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(centerX - 90, y5);
      ctx.lineTo(200, y5);
      ctx.lineTo(200, y3);
      ctx.lineTo(centerX - 100, y3);
      ctx.stroke();
      ctx.restore();
      drawArrow(210, y3, centerX - 100, y3, colors.loopArrow);
      
      // 是 - 结束
      drawArrow(centerX, y5 + 50, centerX, y6 - 30);
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'plan-advanced-workflow.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    draw();
  </script>
</body>
</html>

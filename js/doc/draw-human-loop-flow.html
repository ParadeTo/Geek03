<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人机协作模式流程图生成器</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    #canvas {
      border: 1px solid #ccc;
      background: white;
      display: block;
      margin: 20px auto;
    }
    .controls {
      text-align: center;
      margin: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #1565C0;
    }
  </style>
</head>
<body>
  <div class="controls">
    <h2>人机协作模式工作流程图</h2>
    <button onclick="downloadImage()">💾 下载图片</button>
  </div>
  <canvas id="canvas" width="1400" height="600"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const colors = {
      nodeBg: '#E3F2FD',
      nodeBorder: '#1976D2',
      humanBg: '#FFE0B2',
      humanBorder: '#F57C00',
      toolBg: '#F3E5F5',
      toolBorder: '#7B1FA2',
      final: '#C8E6C9',
      finalBorder: '#388E3C',
      arrow: '#333333',
      envBorder: '#7B1FA2',
    };

    // 绘制圆角矩形
    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // 绘制菱形
    function drawDiamond(x, y, w, h, text, bgColor) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x, y + h / 2);
      ctx.lineTo(x + w / 2, y);
      ctx.lineTo(x + w, y + h / 2);
      ctx.lineTo(x + w / 2, y + h);
      ctx.closePath();
      
      ctx.fillStyle = bgColor;
      ctx.fill();
      ctx.strokeStyle = '#333333';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const lines = text.split('\n');
      const lineHeight = 20;
      const startY = y + h / 2 - ((lines.length - 1) * lineHeight) / 2;
      
      lines.forEach((line, i) => {
        ctx.fillText(line, x + w / 2, startY + i * lineHeight);
      });
      
      ctx.restore();
    }

    // 绘制外框
    function drawContainer(x, y, w, h, title, bgColor, borderColor) {
      ctx.save();
      roundRect(ctx, x, y, w, h, 15);
      ctx.fillStyle = bgColor;
      ctx.fill();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 3;
      ctx.stroke();
      
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(title, x + w / 2, y + 35);
      ctx.restore();
    }

    // 绘制节点
    function drawNode(x, y, w, h, text, bgColor) {
      ctx.save();
      roundRect(ctx, x, y, w, h, 8);
      ctx.fillStyle = bgColor;
      ctx.fill();
      ctx.strokeStyle = '#333333';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const lines = text.split('\n');
      const lineHeight = 22;
      const startY = y + h / 2 - ((lines.length - 1) * lineHeight) / 2;
      
      lines.forEach((line, i) => {
        ctx.fillText(line, x + w / 2, startY + i * lineHeight);
      });
      
      ctx.restore();
    }

    // 绘制箭头
    function drawArrow(x1, y1, x2, y2, color = '#333333', lineWidth = 3) {
      const headlen = 15;
      const angle = Math.atan2(y2 - y1, x2 - x1);
      
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = lineWidth;
      
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(
        x2 - headlen * Math.cos(angle - Math.PI / 6),
        y2 - headlen * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        x2 - headlen * Math.cos(angle + Math.PI / 6),
        y2 - headlen * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
      
      ctx.restore();
    }

    // 绘制虚线箭头
    function drawDashedArrow(x1, y1, x2, y2, color = '#4CAF50') {
      const headlen = 15;
      const angle = Math.atan2(y2 - y1, x2 - x1);
      
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 5]);
      
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      
      ctx.setLineDash([]);
      
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(
        x2 - headlen * Math.cos(angle - Math.PI / 6),
        y2 - headlen * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        x2 - headlen * Math.cos(angle + Math.PI / 6),
        y2 - headlen * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
      
      ctx.restore();
    }

    // 绘制标注
    function drawLabel(x, y, text, color = '#000000', size = 20) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `bold ${size}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    // 绘制流程图
    function draw() {
      // 填充白色背景
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const nodeWidth = 150;
      const nodeHeight = 80;

      // 顶部一行：用户输入、Interrupt
      drawNode(520, 80, 200, nodeHeight, '用户输入\nResume', colors.humanBg);
      drawNode(880, 80, 200, nodeHeight, '暂停等待\nInterrupt', colors.humanBg);

      // 中间：Input、LLM推理、路由判断、Final Answer
      drawNode(100, 300, nodeWidth, nodeHeight, 'Input', colors.nodeBg);
      drawNode(400, 300, nodeWidth, nodeHeight, 'LLM\n推理', colors.nodeBg);
      drawDiamond(720, 290, 160, 100, '路由\n判断', colors.humanBg);
      drawNode(1050, 300, 180, nodeHeight, 'Final\nAnswer', colors.final);

      // 底部：工具执行
      drawNode(720, 480, 180, nodeHeight, '工具执行', colors.toolBg);

      // 中间流程：Input -> LLM推理 -> 路由判断
      drawArrow(250, 340, 400, 340);
      drawArrow(550, 340, 720, 340);

      // 路由判断 → Interrupt（向上）
      drawArrow(800, 290, 960, 160, colors.humanBorder);

      // Interrupt → 用户输入（向左）
      drawArrow(880, 120, 720, 120, colors.humanBorder);

      // 用户输入 → LLM推理（向下）
      drawArrow(620, 160, 475, 300, colors.humanBorder);

      // 路由判断 → 工具执行（向下）
      drawArrow(800, 390, 800, 480, colors.envBorder);

      // 工具执行 → LLM推理（向上向左）
      drawArrow(720, 520, 525, 380, colors.envBorder);

      // 路由判断 → Final Answer（向右）
      drawDashedArrow(880, 340, 1050, 340, '#4CAF50');
    }

    // 下载图片
    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'human-loop-workflow.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // 页面加载时绘制
    draw();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Research Agent Flowchart</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    #canvas {
      border: 1px solid #ccc;
      background: white;
      display: block;
      margin: 20px auto;
    }
    .controls {
      text-align: center;
      margin: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 0 10px;
    }
    button:hover {
      background: #1565C0;
    }
  </style>
</head>
<body>
  <div class="controls">
    <h2>Deep Research Agent Workflow / 深度研究智能体工作流</h2>
    <button onclick="downloadImage()">💾 Download Image / 下载图片</button>
  </div>
  <canvas id="canvas" width="1000" height="600"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const colors = {
      startEndBg: '#E1F5FE',
      startEndBorder: '#0288D1',
      processBg: '#F3E5F5',
      processBorder: '#7B1FA2',
      decisionBg: '#FFF9C4',
      decisionBorder: '#FBC02D',
      actionBg: '#E8F5E9',
      actionBorder: '#388E3C',
      arrow: '#333333',
      text: '#000000'
    };

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawDiamond(ctx, x, y, width, height) {
      ctx.beginPath();
      ctx.moveTo(x, y - height / 2);
      ctx.lineTo(x + width / 2, y);
      ctx.lineTo(x, y + height / 2);
      ctx.lineTo(x - width / 2, y);
      ctx.closePath();
    }

    function drawNode(x, y, width, height, text, bgColor, borderColor, shape = 'rect', stacked = false) {
      ctx.save();

      // Draw stack effect (for parallel nodes)
      if (stacked) {
        const offset = 5;
        ctx.fillStyle = bgColor;
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 2;
        
        // Bottom layer
        ctx.save();
        ctx.translate(offset * 2, -offset * 2);
        roundRect(ctx, x - width / 2, y - height / 2, width, height, 8);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Middle layer
        ctx.save();
        ctx.translate(offset, -offset);
        roundRect(ctx, x - width / 2, y - height / 2, width, height, 8);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // Main Shape
      if (shape === 'diamond') {
        drawDiamond(ctx, x, y, width, height);
      } else if (shape === 'pill') {
        roundRect(ctx, x - width / 2, y - height / 2, width, height, height / 2);
      } else {
        roundRect(ctx, x - width / 2, y - height / 2, width, height, 8);
      }
      
      ctx.fillStyle = bgColor;
      ctx.fill();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.fillStyle = colors.text;
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const lines = text.split('\n');
      const lineHeight = 18;
      const startY = y - ((lines.length - 1) * lineHeight) / 2;
      
      lines.forEach((line, i) => {
        ctx.fillText(line, x, startY + i * lineHeight);
      });
      
      ctx.restore();
    }

    function drawArrow(x1, y1, x2, y2, label = '', curvature = 0, dashed = false) {
      const headlen = 12;
      ctx.save();
      ctx.strokeStyle = colors.arrow;
      ctx.fillStyle = colors.arrow;
      ctx.lineWidth = 2;
      
      if (dashed) {
        ctx.setLineDash([5, 5]);
      }
      
      ctx.beginPath();
      
      if (curvature !== 0) {
          const dx = x2 - x1;
          const dy = y2 - y1;
          const len = Math.sqrt(dx*dx + dy*dy);
          const nx = -dy / len;
          const ny = dx / len;
          
          const cpX = (x1 + x2)/2 + nx * curvature;
          const cpY = (y1 + y2)/2 + ny * curvature;
          
          ctx.moveTo(x1, y1);
          ctx.quadraticCurveTo(cpX, cpY, x2, y2);
          
          var angle = Math.atan2(y2 - cpY, x2 - cpX);
      } else {
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          var angle = Math.atan2(y2 - y1, x2 - x1);
      }
      
      ctx.stroke();
      
      // Arrow Head
      ctx.setLineDash([]); // Reset dash for head
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(
        x2 - headlen * Math.cos(angle - Math.PI / 6),
        y2 - headlen * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        x2 - headlen * Math.cos(angle + Math.PI / 6),
        y2 - headlen * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
      
      // Label
      if (label) {
        let lx, ly;
        if (curvature !== 0) {
             const dx = x2 - x1;
             const dy = y2 - y1;
             const len = Math.sqrt(dx*dx + dy*dy);
             const nx = -dy / len;
             const ny = dx / len;
             lx = (x1 + x2)/2 + nx * (curvature + (curvature > 0 ? 15 : -15));
             ly = (y1 + y2)/2 + ny * (curvature + (curvature > 0 ? 15 : -15));
        } else {
            lx = (x1 + x2) / 2;
            ly = (y1 + y2) / 2;
            ly -= 10;
        }
        
        ctx.fillStyle = '#fff';
        const textWidth = ctx.measureText(label).width + 10;
        ctx.fillRect(lx - textWidth/2, ly - 10, textWidth, 20);
        ctx.fillStyle = colors.arrow;
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, lx, ly);
      }
      
      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const startX = 100, startY = 100;
      const genQueryX = 300, genQueryY = 100;
      const webResearchX = 650, webResearchY = 100;
      const reflectionX = 650, reflectionY = 280;
      const evaluateX = 650, evaluateY = 450;
      const finalizeX = 300, finalizeY = 450;
      const endX = 100, endY = 450;

      // Draw Nodes
      drawNode(startX, startY, 100, 50, 'Start\n开始', colors.startEndBg, colors.startEndBorder, 'pill');
      drawNode(genQueryX, genQueryY, 180, 70, 'Generate Query\n生成查询 (LLM)', colors.processBg, colors.processBorder);
      
      // Stacked Node for Parallel Execution
      drawNode(webResearchX, webResearchY, 180, 70, 'Web Research\n网络搜索 (Tools)', colors.actionBg, colors.actionBorder, 'rect', true);
      
      drawNode(reflectionX, reflectionY, 180, 70, 'Reflection\n反思 (LLM)', colors.processBg, colors.processBorder);
      drawNode(evaluateX, evaluateY, 160, 100, 'Evaluate\nResearch\n评估研究', colors.decisionBg, colors.decisionBorder, 'diamond');
      drawNode(finalizeX, finalizeY, 180, 70, 'Finalize Answer\n总结回答 (LLM)', colors.processBg, colors.processBorder);
      drawNode(endX, endY, 100, 50, 'End\n结束', colors.startEndBg, colors.startEndBorder, 'pill');

      // Draw Arrows
      drawArrow(startX + 50, startY, genQueryX - 90, genQueryY);
      
      // Generate Query -> Web Research (Send)
      drawArrow(genQueryX + 90, genQueryY, webResearchX - 90, webResearchY, 'Send: Queries / 并行分发');
      
      // Web Research -> Reflection (Wait for All)
      drawArrow(webResearchX, webResearchY + 35, reflectionX, reflectionY - 35, 'Wait All / 等待所有结果', 0, true);
      
      // Reflection -> Evaluate
      drawArrow(reflectionX, reflectionY + 35, evaluateX, evaluateY - 50);
      
      // Evaluate -> Finalize
      drawArrow(evaluateX - 80, evaluateY, finalizeX + 90, finalizeY, 'Sufficient / 足够');
      
      // Evaluate -> Web Research (Send / Loop)
      drawArrow(evaluateX + 80, evaluateY, webResearchX + 90, webResearchY, 'Send: Follow-ups / 并行分发', 120);
      
      drawArrow(finalizeX - 90, finalizeY, endX + 50, endY);
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'deep-research-workflow.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    draw();
  </script>
</body>
</html>

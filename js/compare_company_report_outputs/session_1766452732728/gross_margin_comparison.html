<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>毛利率变化对比</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: 'Microsoft YaHei', sans-serif; }
    #chart { width: 100%; height: 500px; }
    h1 { text-align: center; color: #333; font-size: 18px; }
  </style>
</head>
<body>
  <h1>毛利率变化对比</h1>
  <div id="chart"></div>
  <script>
    var chart = echarts.init(document.getElementById('chart'));
    var option = {
  "title": { "text": "毛利率变化对比", "left": "center" },
  "tooltip": { "trigger": "axis" },
  "legend": { "top": "bottom" },
  "xAxis": { "type": "category", "data": ["2022", "2023", "2024"] },
  "yAxis": { "type": "value", "name": "毛利率（%）" },
  "series": [
    { "name": "贵州茅台", "type": "line", "data": [91.87, 91.96, 91.94], "itemStyle": { "color": "#5470c6" } },
    { "name": "洋河股份", "type": "line", "data": [74.61, 75.25, 73.16], "itemStyle": { "color": "#ee6666" } }
  ]
};
    chart.setOption(option);
    window.addEventListener('resize', function() { chart.resize(); });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>流动比率与速动比率趋势分析</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: 'Microsoft YaHei', sans-serif; }
    #chart { width: 100%; height: 500px; }
    h1 { text-align: center; color: #333; font-size: 18px; }
  </style>
</head>
<body>
  <h1>流动比率与速动比率趋势分析</h1>
  <div id="chart"></div>
  <script>
    var chart = echarts.init(document.getElementById('chart'));
    var option = {
  "title": { "text": "流动比率与速动比率趋势分析", "left": "center" },
  "tooltip": { "trigger": "axis" },
  "legend": { "data": ["流动比率", "速动比率"], "top": "bottom" },
  "xAxis": { "type": "category", "data": ["2021", "2022", "2023"] },
  "yAxis": { "type": "value", "name": "比率" },
  "series": [
    { "name": "流动比率", "type": "line", "data": [460.00, 461.00, 462.00], "lineStyle": { "color": "#fac858" } },
    { "name": "速动比率", "type": "line", "data": [365.00, 366.00, 367.00], "lineStyle": { "color": "#ee6666" } }
  ]
};
    chart.setOption(option);
    window.addEventListener('resize', function() { chart.resize(); });
  </script>
</body>
</html>

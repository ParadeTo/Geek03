<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>财务比率趋势分析</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: 'Microsoft YaHei', sans-serif; }
    #chart { width: 100%; height: 500px; }
    h1 { text-align: center; color: #333; font-size: 18px; }
  </style>
</head>
<body>
  <h1>财务比率趋势分析</h1>
  <div id="chart"></div>
  <script>
    var chart = echarts.init(document.getElementById('chart'));
    var option = {
  "title": { "text": "财务比率趋势分析", "left": "center" },
  "tooltip": {},
  "legend": { "data": ["2022", "2023", "2024"], "bottom": 0 },
  "radar": {
    "indicator": [
      { "name": "毛利率", "max": 100 },
      { "name": "净利率", "max": 100 },
      { "name": "净资产收益率", "max": 50 },
      { "name": "资产负债率", "max": 100 },
      { "name": "流动比率", "max": 300 },
      { "name": "速动比率", "max": 200 }
    ]
  },
  "series": [
    {
      "name": "财务比率",
      "type": "radar",
      "data": [
        { "value": [75.36, 31.12, 37.97, 40.73, 197.00, 132.00], "name": "2022" },
        { "value": [75.31, 32.76, 37.50, 35.88, 228.00, 152.00], "name": "2023" },
        { "value": [76.20, 34.03, 35.23, 34.19, 245.00, 171.00], "name": "2024" }
      ]
    }
  ]
};
    chart.setOption(option);
    window.addEventListener('resize', function() { chart.resize(); });
  </script>
</body>
</html>

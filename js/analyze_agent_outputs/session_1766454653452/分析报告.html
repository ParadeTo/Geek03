    const mdContent = "# 山西杏花村汾酒厂股份有限公司 财务数据分析报告\n\n## 分析概述\n本报告分析了山西杏花村汾酒厂股份有限公司在过去三年的财务数据，涵盖财务比率、杠杆与流动性、以及运营效率多个方面。\n\n## 关键发现\n1. **盈利能力增强**：公司的毛利率保持在较高水平，净利率和净资产收益率有良好的上升趋势，反映出盈利能力的提升。\n2. **财务健康改善**：资产负债率逐年降低，同时流动比率和速动比率逐步上升，表明公司在提高财务稳定性上取得进展。\n3. **库存管理挑战**：虽然应收账款周转天数接近于零，显示出较高的运营效率，但存货周转天数的增加可能成为库存管理的潜在风险。\n\n## 图表分析\n\n### 主要财务比率趋势\n<div id=\"chart_key_financial_ratios_trend\" style=\"width:100%;height:400px;margin:20px 0;\"></div>\n从图中可以看出，公司的毛利率总体保持稳定，净利率和净资产收益率均有所上升，显示出公司盈利能力的逐步增强。\n\n### 财务杠杆与流动性比率趋势\n<div id=\"chart_leverage_liquidity_ratios_trend\" style=\"width:100%;height:400px;margin:20px 0;\"></div>\n本图显示公司的资产负债率逐年下降，而流动比率和速动比率则逐渐上升，表明公司的负债比例降低，流动性增强，财务健康状况有所改善。\n\n### 运营效率指标趋势\n<div id=\"chart_operational_efficiency_trend\" style=\"width:100%;height:400px;margin:20px 0;\"></div>\n应收账款周转天数趋于零，显示出其应收账款管理效率较高，但存货周转天数有所上升，提示公司可能面临库存管理上的挑战。\n\n## 结论与建议\n综合以上分析，公司在盈利能力和财务健康方面表现较好，但需特别注意库存管理的问题。建议进一步优化库存管理流程，提高存货周转效率，以减少潜在的财务风险。";

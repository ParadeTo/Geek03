<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>主要财务比率趋势</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: 'Microsoft YaHei', sans-serif; }
    #chart { width: 100%; height: 500px; }
    h1 { text-align: center; color: #333; font-size: 18px; }
  </style>
</head>
<body>
  <h1>主要财务比率趋势</h1>
  <div id="chart"></div>
  <script>
    var chart = echarts.init(document.getElementById('chart'));
    var option = {
  "title": { "text": "主要财务比率趋势", "left": "center" },
  "tooltip": { "trigger": "axis" },
  "legend": { "data": ["毛利率", "净利率", "净资产收益率"], "top": "bottom" },
  "xAxis": { "type": "category", "data": ["2022", "2023", "2024"] },
  "yAxis": { "type": "value", "name": "百分比（%）" },
  "series": [
    { "name": "毛利率", "type": "line", "data": [75.36, 75.31, 76.20], "lineStyle": { "color": "#5470c6" } },
    { "name": "净利率", "type": "line", "data": [31.12, 32.76, 34.03], "lineStyle": { "color": "#91cc75" } },
    { "name": "净资产收益率", "type": "line", "data": [37.97, 37.50, 35.23], "lineStyle": { "color": "#fac858" } }
  ]
};
    chart.setOption(option);
    window.addEventListener('resize', function() { chart.resize(); });
  </script>
</body>
</html>
